# Ten-percent chronological target-domain adaptation. Supply train.init_checkpoint
# on the command line helper scripts/run_acommset_fewshot.py.
seed: 47
output_dir: results/acommset/few_shot

data:
  kind: prepared
  root: data/prepared/acommset_few_shot
  history: 16
  horizon: 1

model:
  kind: aquapilot
  hidden_dim: 64
  rank: 4
  conv_kernel: 5
  dropout: 0.08
  min_sigma: 0.001

train:
  torch_threads: 4
  device: auto
  batch_size: 32
  epochs: 12
  learning_rate: 0.0002
  weight_decay: 0.0002
  gradient_clip: 1.0
  early_stopping_patience: 4
  scheduler_patience: 2
  min_delta: 0.00005
  num_workers: 0
  init_checkpoint: null

pilot:
  ratio: 0.125
  training_mask_mode: mixed
  extra_block_mask: 0.20
  observation_sigma: 0.04
  min_spacing: 3
  gradient_weight: 0.0
  update_length_scale: 5.0

loss:
  nll_weight: 1.0
  nmse_weight: 0.35
  causal_weight: 0.02
  smooth_weight: 0.005
  rank_weight: 0.0001
  max_delay_bins: 24

classical:
  covariance_shrinkage: 0.05
  max_covariance_frames: 20000
  omp_delay_bins: 24
  omp_sparsity: 6
  omp_ridge: 0.000001

eval:
  mask_strategies: [comb, random, uncertainty, active]
  run_classical: false
  snr_db: [0, 5, 10, 15, 20]
  link_trials: 8
  block_subcarriers: 16
  code_rate: 0.5
