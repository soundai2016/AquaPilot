[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aquapilot"
version = "1.1"
description = "Adaptive pilot placement for underwater acoustic OFDM"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Xiaoliang Chen"},
  {name = "Le Chang"},
  {name = "Liya Liu"},
  {name = "Peiwen Sun"},
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "PyYAML>=6.0",
  "torch>=2.3",
  "h5py>=3.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]
download = ["requests>=2.32", "beautifulsoup4>=4.12"]

[project.urls]
Repository = "https://github.com/soundai2016/AquaPilot"

[project.scripts]
aquapilot = "aquapilot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
