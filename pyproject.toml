[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aquapilot"
version = "0.1.0"
description = "Uncertainty-guided active pilot sounding for underwater OFDM"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Anonymous WUWNet 2026 Authors"}]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "PyYAML>=6.0",
  "torch>=2.3",
  "h5py>=3.11",
  "scikit-learn>=1.5",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
]

[project.scripts]
aquapilot = "aquapilot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
